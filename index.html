<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🐉 RedDragon-DFS</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: Arial, sans-serif;
      background: #0a0a1a;
      color: #fff;
      padding: 20px;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .container { max-width: 450px; width: 100%; }
    .header {
      text-align: center;
      padding: 30px;
      background: linear-gradient(135deg, #1a0505, #2a0a0a);
      border-radius: 20px;
      border: 2px solid rgba(255,68,68,0.3);
      margin-bottom: 20px;
    }
    .header h1 { font-size: 36px; color: #ff8800; }
    .header .sub { color: #ff4444; font-size: 14px; letter-spacing: 2px; }
    .card {
      background: rgba(26,10,10,0.8);
      border-radius: 16px;
      padding: 20px;
      margin: 12px 0;
      border: 1px solid rgba(255,68,68,0.15);
    }
    .card h3 { color: #ff8800; margin-bottom: 10px; }
    input {
      width: 100%;
      padding: 14px;
      margin: 8px 0;
      border: 2px solid rgba(255,255,255,0.1);
      border-radius: 12px;
      background: #0a0a1a;
      color: #fff;
      font-size: 14px;
    }
    input:focus { border-color: #ff8800; outline: none; }
    .btn {
      width: 100%;
      padding: 16px;
      margin: 8px 0;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      text-transform: uppercase;
      transition: all 0.3s;
    }
    .btn:active { transform: scale(0.97); }
    .btn-primary {
      background: linear-gradient(135deg, #ff4444, #ff8800);
      color: #fff;
    }
    .btn-danger {
      background: linear-gradient(135deg, #ff0000, #cc0000);
      color: #fff;
    }
    .btn-secondary {
      background: rgba(255,255,255,0.1);
      color: #fff;
      border: 1px solid rgba(255,255,255,0.1);
    }
    .code-display {
      background: #0a0a1a;
      border-radius: 12px;
      padding: 20px;
      text-align: center;
      border: 2px dashed rgba(255,136,0,0.3);
      display: none;
      margin: 12px 0;
    }
    .code-display.show { display: block; animation: fadeIn 0.5s; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    .code-display .code {
      font-size: 36px;
      font-weight: 900;
      color: #ff8800;
      letter-spacing: 6px;
      font-family: 'Courier New', monospace;
    }
    .footer {
      text-align: center;
      padding: 16px;
      color: rgba(255,255,255,0.15);
      font-size: 11px;
      letter-spacing: 1px;
    }
    .footer a { color: #ff4444; text-decoration: none; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>🐉 RedDragon-DFS</h1>
      <div class="sub">⚡ BUILT TO WIN ⚡</div>
      <div style="margin-top:8px; font-size:12px; color:rgba(255,255,255,0.3);">v1.0.0</div>
    </div>
    
    <div class="card">
      <h3>📱 PAIR DEVICE</h3>
      <p style="color:rgba(255,255,255,0.4); font-size:13px;">Enter your WhatsApp number with country code</p>
      <input id="phoneInput" placeholder="e.g., 27634988678">
      <button class="btn btn-primary" onclick="pairDevice()">🔗 PAIR DEVICE</button>
    </div>
    
    <div id="codeDisplay" class="code-display">
      <div style="font-size:12px; color:rgba(255,255,255,0.3); margin-bottom:8px;">🔑 PAIRING CODE</div>
      <div id="pairCode" class="code">---- ----</div>
      <div style="font-size:12px; color:rgba(255,255,255,0.3); margin-top:8px;">
        Enter this in WhatsApp → Settings → Linked Devices
      </div>
      <button class="btn btn-secondary" onclick="copyCode()" style="margin-top:12px; padding:12px;">📋 Copy Code</button>
    </div>
    
    <div class="card">
      <h3>⚡ QUICK ACTIONS</h3>
      <div class="grid-2">
        <button class="btn btn-secondary" onclick="sendCommand('ping')">🏓 Ping</button>
        <button class="btn btn-secondary" onclick="sendCommand('status')">📊 Status</button>
        <button class="btn btn-secondary" onclick="getDevices()">📇 Devices</button>
        <button class="btn btn-secondary" onclick="closeApp()">❌ Close</button>
      </div>
    </div>
    
    <div class="footer">
      🐉 <a href="https://telegram-home-redxmd.vercel.app" target="_blank">RedDragon-DFS</a><br>
      Powered by Baileys
    </div>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();
    
    let currentCode = '';
    
    function pairDevice() {
      const number = document.getElementById('phoneInput').value.trim();
      if (!number) {
        tg.showPopup({
          title: '⚠️ Error',
          message: 'Enter a phone number',
          buttons: [{type: 'ok'}]
        });
        return;
      }
      
      if (!/^\d+$/.test(number)) {
        tg.showPopup({
          title: '⚠️ Error',
          message: 'Use only digits',
          buttons: [{type: 'ok'}]
        });
        return;
      }
      
      tg.sendData(JSON.stringify({
        action: 'pair',
        number: number
      }));
      
      tg.showPopup({
        title: '⏳ Processing',
        message: `Pairing +${number}...`,
        buttons: [{type: 'ok'}]
      });
    }
    
    function copyCode() {
      if (currentCode) {
        tg.sendData(JSON.stringify({
          action: 'copy_code',
          code: currentCode
        }));
        tg.showPopup({
          title: '✅ Copied!',
          message: 'Code copied to clipboard',
          buttons: [{type: 'ok'}]
        });
      }
    }
    
    function sendCommand(cmd) {
      tg.sendData(JSON.stringify({
        action: 'send_command',
        command: cmd
      }));
      tg.showPopup({
        title: '⚡ Command Sent',
        message: `/${cmd} sent to WhatsApp`,
        buttons: [{type: 'ok'}]
      });
      setTimeout(() => tg.close(), 1000);
    }
    
    function getDevices() {
      tg.sendData(JSON.stringify({
        action: 'get_devices'
      }));
      tg.showPopup({
        title: '📇 Loading',
        message: 'Check Telegram chat',
        buttons: [{type: 'ok'}]
      });
      setTimeout(() => tg.close(), 1500);
    }
    
    function closeApp() {
      tg.close();
    }
    
    // Handle responses from bot
    tg.onEvent('web_app_data', function(data) {
      try {
        const parsed = JSON.parse(data);
        console.log('📱 Bot response:', parsed);
        
        if (parsed.action === 'pairing_code') {
          currentCode = parsed.code;
          document.getElementById('pairCode').textContent = parsed.code;
          document.getElementById('codeDisplay').classList.add('show');
          tg.showPopup({
            title: '🔑 Pairing Code',
            message: `Code: ${parsed.code}\n\nEnter this in WhatsApp`,
            buttons: [{type: 'ok'}]
          });
        }
      } catch(e) {
        console.error('Parse error:', e);
      }
    });
    
    // Keyboard shortcuts
    document.addEventListener('keydown', function(e) {
      if (e.key === 'Enter') {
        const active = document.activeElement;
        if (active.id === 'phoneInput') {
          pairDevice();
        }
      }
      if (e.key === 'Escape') {
        closeApp();
      }
    });
    
    console.log('🐉 RedDragon-DFS Web App loaded!');
  </script>
</body>
</html>
